{% extends "base.html" %}
{% block title %}Invitation unavailable · Spendy{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto p-4" hx-history="false">
  <section class="card bg-base-100 shadow">
    <div class="card-body p-4 sm:p-7">
      <h1 class="text-2xl font-semibold">Invitation unavailable</h1>
      <div class="alert alert-error" role="alert">{{ error }}</div>
      <p>This link may have expired, been revoked, or already been used.</p>
      <a class="btn btn-primary" href="/auth/login">Log in</a>
    </div>
  </section>
</div>
{% endblock %}
