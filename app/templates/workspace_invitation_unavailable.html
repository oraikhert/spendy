{% extends "base.html" %}
{% block title %}Invitation unavailable · Spendy{% endblock %}
{% block content %}
<div class="workspace-shell mx-auto my-6 max-w-lg sm:my-10" hx-history="false">
  <section class="card bg-base-100 shadow-sm" aria-labelledby="invitation-unavailable-heading"><div class="card-body gap-4 p-4 sm:p-6"><header class="space-y-2"><h1 id="invitation-unavailable-heading" class="text-3xl font-bold tracking-tight">Invitation unavailable</h1><p class="text-base-content/70">This link may have expired, been revoked, or already been used.</p></header><div class="alert alert-error" role="alert">{{ error }}</div><a class="btn btn-primary w-fit" href="/auth/login">Log in</a></div></section>
</div>
{% endblock %}
